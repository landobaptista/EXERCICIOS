<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>centralização vertical de imagem</title>
    <style>
        #conteiner{
            background-image: url("imagens-cap19/target001.png");
            background-size: 100% 100%;
            position: relative;
            background-color: purple;
            height: 500px;
            padding: 10px;
        
        }
        #conteudo{
             background-image: url("imagens-cap19/target001.png");
             background-position: center center;
            background-size: 100% 100%; 
            position: absolute;
            background-color: yellow;
            height: 200px;
            width: 400px;
            transform:translate(-50% , -50%) ;
    

            left: 50%;
            top:  50%;
        }   
    </style>
</head>
<body>
    <section id="conteiner">
        <article id="conteudo">

        </article>
    </section>
</body>
</html>
